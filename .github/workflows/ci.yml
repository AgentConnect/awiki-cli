name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: scripts/test-unit.sh

      - name: Run coverage gate
        env:
          AWIKI_CLI_COVERPROFILE: ${{ github.workspace }}/coverage/unit-cover.out
        run: scripts/test-unit-cover.sh --check --show-profile

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit-cover.out
          if-no-files-found: error
