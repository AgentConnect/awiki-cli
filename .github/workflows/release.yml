name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render public skill package
        run: bash scripts/release/render-public-skill.sh

      - name: Generate update metadata
        run: node scripts/release/generate-update-metadata.js

      - name: Verify canonical release assets
        run: bash scripts/release/verify-release-assets.sh

      - name: Upload canonical release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/update-metadata.json \
            "dist/public-skill/awiki-cli/SKILL.md#public-skill-awiki-cli-SKILL.md" \
            "dist/public-skill/skill-manifest.json#public-skill-skill-manifest.json" \
            --clobber

      - name: Publish to npm (stable tags only)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @awiki/cli bootstrap package to npm for ${GITHUB_REF}..."
          npm publish --access public
