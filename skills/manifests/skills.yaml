version: 2
current_binary: awiki-cli
layout: single_entry_references
entry:
  name: awiki-cli
  path: skills/SKILL.md
  type: entry
  description: Unified entry skill for awiki-cli identity, messaging, group, runtime, page, onboarding, and debug tasks.
  loading_mode: minimal
  default_load:
    - skills/SKILL.md
  reference_dir: skills/references
status_legend:
  implemented: Reference content matches commands that are currently implemented in the repo.
  partial: Reference mixes implemented behavior with related capabilities that are still planned or only partly available.
  planned: Reference documents a reserved or future contract that is not implemented yet.
source_of_truth:
  command_contract: internal/cmdmeta/catalog.go
  entry_docs:
    - skills/SKILL.md
  reference_docs: skills/references/*.md
  manifest_role: structured index for routing, maintenance, and tooling; not a runtime dependency.
references:
  - name: installation
    path: skills/references/00-installation.md
    type: installation
    implemented_status: implemented
    description: CLI install, skill install, workspace init, runtime setup, and OpenClaw host integration guidance.
    keywords: [install, init, workspace, runtime, openclaw]
    covered_commands:
      - init
      - runtime.setup
      - runtime.listener.status
      - runtime.listener.start
      - runtime.host-notify.config.show
      - runtime.host-notify.config.set
      - runtime.host-notify.enable
      - runtime.host-notify.openclaw.set
      - runtime.host-notify.openclaw.set-token
  - name: onboarding
    path: skills/references/01-onboarding.md
    type: workflow
    implemented_status: implemented
    description: "First usable setup after installation: identity registration or recovery, then overall status validation."
    keywords: [first-time, onboarding, register, recover, status]
    covered_commands:
      - id.status
      - id.list
      - id.import-v1
      - id.register
      - id.recover
      - status
      - runtime.status
  - name: identity
    path: skills/references/02-identity.md
    type: domain
    implemented_status: implemented
    description: DID, handle, bind, recover, profile, and local identity switching.
    keywords: [identity, did, handle, recover, bind, profile]
    covered_commands:
      - id.status
      - id.list
      - id.current
      - id.use
      - id.register
      - id.bind
      - id.resolve
      - id.recover
      - id.profile.get
      - id.profile.set
      - id.import-v1
      - id.create
  - name: messaging
    path: skills/references/03-messaging.md
    type: domain
    implemented_status: partial
    description: Direct and group messaging, inbox, history, attachment send/download, and secure-message contract.
    keywords: [msg, inbox, history, attachment, mark-read, secure]
    covered_commands:
      - msg.send
      - msg.attachment.download
      - msg.inbox
      - msg.history
      - msg.mark-read
  - name: groups
    path: skills/references/04-groups.md
    type: domain
    implemented_status: implemented
    description: Group lifecycle, member management, policy updates, and group message views.
    keywords: [group, join, leave, member, policy]
    covered_commands:
      - group.create
      - group.get
      - group.join
      - group.add
      - group.remove
      - group.leave
      - group.update
      - group.members
      - group.messages
  - name: runtime
    path: skills/references/05-runtime.md
    type: domain
    implemented_status: partial
    description: Runtime mode, listener lifecycle, host notify, and current heartbeat limitations.
    keywords: [runtime, websocket, listener, host-notify, transport]
    covered_commands:
      - runtime.status
      - runtime.apply
      - runtime.setup
      - runtime.mode.get
      - runtime.mode.set
      - runtime.listener.status
      - runtime.listener.install
      - runtime.listener.start
      - runtime.listener.stop
      - runtime.listener.restart
      - runtime.listener.uninstall
      - runtime.listener.config.show
      - runtime.listener.config.set
      - runtime.listener.enable
      - runtime.listener.disable
      - runtime.host-notify.config.show
      - runtime.host-notify.config.set
      - runtime.host-notify.enable
      - runtime.host-notify.disable
      - runtime.host-notify.openclaw.set
      - runtime.host-notify.openclaw.set-token
      - runtime.host-notify.openclaw.clear-token
    planned_commands:
      - runtime.heartbeat.status
      - runtime.heartbeat.install
      - runtime.heartbeat.run-once
  - name: pages
    path: skills/references/06-pages.md
    type: domain
    implemented_status: implemented
    description: Content page lifecycle, markdown publishing, slug changes, and visibility updates.
    keywords: [page, slug, markdown, visibility]
    covered_commands:
      - page.create
      - page.list
      - page.get
      - page.update
      - page.rename
      - page.delete
  - name: discovery
    path: skills/references/07-discovery.md
    type: workflow
    implemented_status: partial
    description: Review groups, inspect candidates, gather context, and draft manual introductions.
    keywords: [discovery, group review, intro, candidate]
    covered_commands:
      - group.get
      - group.members
      - group.messages
      - id.profile.get
      - msg.history
  - name: debug
    path: skills/references/08-debug.md
    type: debug
    implemented_status: partial
    description: Last-resort SQLite inspection and migration import checks.
    keywords: [debug, sqlite, import-v1]
    covered_commands:
      - debug.db.query
      - debug.db.import-v1
    planned_commands:
      - debug.raw.rpc
      - debug.schema-cache
      - debug.logs
  - name: people_planned
    path: skills/references/09-people-planned.md
    type: appendix
    implemented_status: planned
    description: Future people, relationship, and local-contact contract boundary.
    keywords: [people, follow, contacts]
    planned_commands:
      - people.search
      - people.follow
      - people.unfollow
      - people.status
      - people.followers
      - people.following
      - people.contacts.list
      - people.contacts.save
