schema_version: 1
identity:
  active: ""
runtime:
  mode: websocket
  socket_path: ""
  listener:
    enabled: true
    auto_install: true
    auto_start: true
  host_notify:
    enabled: true
    sink: log
    file_path: ""
    openclaw:
      hook_url: http://127.0.0.1:18789/hooks/agent
      agent_id: main
      hook_name: AWiki
      token: ""
output:
  format: json
  no_color: false
services:
